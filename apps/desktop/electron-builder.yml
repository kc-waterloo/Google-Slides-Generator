appId: com.gsg.desktop
productName: GSG Desktop
electronVersion: 42.3.3
directories:
  output: release
  buildResources: resources
files:
  - dist-electron
  - "!node_modules/**/*"
extraResources:
  - from: ../web-ui/dist
    to: renderer
mac:
  target:
    - dmg
    - zip
  artifactName: "${productName}-${version}-${arch}.${ext}"
win:
  target:
    - nsis
  artifactName: "${productName}-${version}-setup.${ext}"
linux:
  target:
    - AppImage
    - deb
  artifactName: "${productName}-${version}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
